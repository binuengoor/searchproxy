services:
  searchproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/binuengoor/searchproxy:latest
    container_name: searchproxy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CRAWL4AI_URL=http://crawl4ai:11235
      - BYPARR_URL=http://byparr:8191/v1
      - TIKA_URL=http://tika:9998/tika
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/data
    depends_on:
      - crawl4ai
      - byparr
      - tika

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: searchproxy-crawl4ai
    ports:
      - "11235:11235"
    restart: unless-stopped
    shm_size: 1g

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: searchproxy-byparr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    container_name: searchproxy-tika
    ports:
      - "9998:9998"
    restart: unless-stopped

