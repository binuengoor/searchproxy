services:
  searchproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/binuengoor/searchproxy:latest
    container_name: searchproxy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CRAWL4AI_URL=http://crawl4ai:11235
      - BYPARR_URL=http://byparr:8191/v1
      - TIKA_URL=http://tika:9998/tika
      - SEARXNG_URL=http://searxng:8080/search
      - VANE_URL=http://vane:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/data
    depends_on:
      - crawl4ai
      - byparr
      - tika
      - searxng
      - vane

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: searchproxy-crawl4ai
    ports:
      - "11235:11235"
    restart: unless-stopped
    shm_size: 1g

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: searchproxy-byparr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    container_name: searchproxy-tika
    ports:
      - "9998:9998"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searchproxy-searxng
    ports:
      - "8980:8080"
    volumes:
      - ./searxng/config:/etc/searxng
      - ./searxng/data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=https://searxng.home.askbp.win
    restart: unless-stopped

  vane:
    image: itzcrazykns1337/vane:latest
    container_name: searchproxy-vane
    ports:
      - "3001:3000"
    volumes:
      - ./vane/data:/home/vane/data
    environment:
      - SEARXNG_API_URL=http://searxng:8080
    restart: unless-stopped
    depends_on:
      - searxng


